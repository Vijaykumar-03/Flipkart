---
- name: Install DevOps Tools
  hosts: servers
  become: yes

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Git
      apt:
        name: git
        state: present

    - name: Install Python
      apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Install AWS CLI
      apt:
        name: awscli
        state: present

    - name: Install Nginx
      apt:
        name: nginx
        state: present

