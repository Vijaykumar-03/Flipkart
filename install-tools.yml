---
- name: Install DevOps Tools
  hosts: servers
  become: yes

  vars_files:
    - secrets.yml

  vars:
    aws_region: "ap-south-1"
    aws_account_id: "847547470089"

    eks_cluster_name: "devops-eks"
    kubeconfig_path: "/root/.kube/config"
    aws_access_key_id: "{{ vault_aws_access_key_id }}"
    aws_secret_access_key: "{{ vault_aws_secret_access_key }}"
    github_repo: "https://github.com/Vijaykumar-03/Flipkart.git"
    app_directory: "/opt/Flipkart"
    sonarqube_container: "sonarqube"
    sonarqube_db_container: "sonarqube-db"

    sonarqube_db_name: "sonarqube"
    sonarqube_db_user: "sonarqube"
    sonarqube_db_password: "sonarqube123"

    monitoring_namespace: "monitoring"

    prometheus_release: "kube-prometheus-stack"
    grafana_release: "kube-prometheus-stack"

    # EKS API access
    eks_cluster_security_group: "sg-051f4bc1ea55218a2"
    ec2_security_group: "sg-05df204b7b36f890e"



  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        
    - name: Install required packages
      apt:
        name:
          - git
          - python3
          - python3-pip
          - python3-venv
          - awscli
          - curl
          - wget
          - unzip
          - ca-certificates
          - gnupg
          - fontconfig
        state: present

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Update apt cache after Docker repository
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Download kubectl version
      get_url:
        url: https://dl.k8s.io/release/stable.txt
        dest: /tmp/kubectl-version
        mode: '0644'

    - name: Read kubectl version
      command: cat /tmp/kubectl-version
      register: kubectl_version
      changed_when: false

    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'
    - name: Install eksctl
      shell: |
        set -e

        ARCH=$(uname -m)

        if [ "$ARCH" = "x86_64" ]; then
          EKSCTL_ARCH="amd64"
        elif [ "$ARCH" = "aarch64" ]; then
          EKSCTL_ARCH="arm64"
        else
          echo "Unsupported architecture: $ARCH"
          exit 1
        fi

        curl --fail --silent --show-error --location \
          "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_${EKSCTL_ARCH}.tar.gz" \
          -o /tmp/eksctl.tar.gz

        tar -xzf /tmp/eksctl.tar.gz -C /tmp

        install -m 0755 /tmp/eksctl /usr/local/bin/eksctl

        rm -f /tmp/eksctl.tar.gz
        rm -f /tmp/eksctl

      args:
        creates: /usr/local/bin/eksctl


    - name: Check eksctl version
      command: eksctl version
      register: eksctl_version
      changed_when: false

    - name: Install Helm
      shell: |
        set -e
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      args:
        creates: /usr/local/bin/helm


    - name: Check Helm version
      command: helm version --short
      register: helm_version
      changed_when: false

    - name: Install Ansible Kubernetes collection
      command: ansible-galaxy collection install kubernetes.core
      changed_when: false

    - name: Install Python Kubernetes client
      apt:
        name:
          - python3-kubernetes
        state: present

    - name: Configure AWS CLI
      shell: |
        aws configure set aws_access_key_id "{{ aws_access_key_id }}"
        aws configure set aws_secret_access_key "{{ aws_secret_access_key }}"
        aws configure set region "{{ aws_region }}"
        aws configure set output json

      no_log: true
    - name: Check AWS identity
      command: aws sts get-caller-identity
      register: aws_identity
      changed_when: false

    - name: Display AWS identity
      debug:
        var: aws_identity.stdout

    - name: Create .kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: Configure kubeconfig for EKS
      ansible.builtin.command:
        cmd: >
          aws eks update-kubeconfig
          --region {{ aws_region }}
          --name {{ eks_cluster_name }}
          --kubeconfig {{ kubeconfig_path }}
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      no_log: true

    # ==========================================
    # EKS NETWORK / ENDPOINT VALIDATION
    # ==========================================

    - name: Get EKS endpoint configuration
      ansible.builtin.shell: |
        aws eks describe-cluster           --name "{{ eks_cluster_name }}"           --region "{{ aws_region }}"           --query 'cluster.resourcesVpcConfig.{vpc:vpcId,private:endpointPrivateAccess,public:endpointPublicAccess,cidrs:publicAccessCidrs,sg:clusterSecurityGroupId,subnets:subnetIds}'           --output json
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: eks_endpoint_config
      changed_when: false

    - name: Display EKS endpoint configuration
      ansible.builtin.debug:
        var: eks_endpoint_config.stdout

    - name: Get EKS cluster status
      ansible.builtin.shell: |
        aws eks describe-cluster           --name "{{ eks_cluster_name }}"           --region "{{ aws_region }}"           --query 'cluster.status'           --output text
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: eks_cluster_status
      changed_when: false

    - name: Display EKS cluster status
      ansible.builtin.debug:
        msg: "EKS cluster status: {{ eks_cluster_status.stdout }}"

    - name: Get EC2 instance ID from metadata
      ansible.builtin.shell: |
        TOKEN=$(curl -sS -X PUT           -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"           http://169.254.169.254/latest/api/token)

        curl -sS           -H "X-aws-ec2-metadata-token: $TOKEN"           http://169.254.169.254/latest/meta-data/instance-id
      register: ec2_instance_id
      changed_when: false

    - name: Display EC2 instance ID
      ansible.builtin.debug:
        msg: "EC2 instance ID: {{ ec2_instance_id.stdout }}"

    - name: Get EC2 VPC subnet IP and security groups
      ansible.builtin.shell: |
        aws ec2 describe-instances           --instance-ids "{{ ec2_instance_id.stdout }}"           --region "{{ aws_region }}"           --query 'Reservations[0].Instances[0].{VpcId:VpcId,SubnetId:SubnetId,PrivateIp:PrivateIpAddress,SecurityGroups:SecurityGroups[*].GroupId}'           --output json
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: ec2_network_config
      changed_when: false

    - name: Display EC2 network configuration
      ansible.builtin.debug:
        var: ec2_network_config.stdout

    - name: Get EKS API endpoint
      ansible.builtin.shell: |
        aws eks describe-cluster           --name "{{ eks_cluster_name }}"           --region "{{ aws_region }}"           --query 'cluster.endpoint'           --output text
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: eks_endpoint
      changed_when: false

    - name: Resolve EKS API endpoint
      ansible.builtin.shell: |
        getent hosts "{{ eks_endpoint.stdout | regex_replace('^https://', '') }}"
      register: eks_endpoint_dns
      changed_when: false
      failed_when: false

    - name: Display EKS endpoint DNS resolution
      ansible.builtin.debug:
        msg: "{{ eks_endpoint_dns.stdout | default('DNS resolution failed') }}"

    - name: Test EKS API endpoint HTTPS connectivity
      ansible.builtin.shell: |
        curl -vk --connect-timeout 10 "{{ eks_endpoint.stdout }}/healthz"
      register: eks_api_connectivity
      changed_when: false
      failed_when: false

    - name: Display EKS API connectivity result
      ansible.builtin.debug:
        msg: "{{ eks_api_connectivity.stderr | default('No connectivity output') }}"

    - name: Check EKS endpoint update status
      ansible.builtin.shell: |
        UPDATE_ID=$(aws eks list-updates           --name "{{ eks_cluster_name }}"           --region "{{ aws_region }}"           --query 'updateIds[0]'           --output text)

        if [ "$UPDATE_ID" != "None" ] && [ -n "$UPDATE_ID" ]; then
          aws eks describe-update             --name "{{ eks_cluster_name }}"             --region "{{ aws_region }}"             --update-id "$UPDATE_ID"             --query 'update.{status:status,errors:errors}'             --output json
        else
          echo '{"status":"No recent update found","errors":[]}'
        fi
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: eks_update_status
      changed_when: false
      failed_when: false

    - name: Display EKS endpoint update status
      ansible.builtin.debug:
        var: eks_update_status.stdout

    # ==========================================
    # EKS API SECURITY GROUP ACCESS
    # ==========================================

    - name: Allow EC2 security group to access EKS API on TCP 443
      ansible.builtin.shell: |
        aws ec2 authorize-security-group-ingress           --group-id "{{ eks_cluster_security_group }}"           --protocol tcp           --port 443           --source-group "{{ ec2_security_group }}"           --region "{{ aws_region }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: eks_sg_rule
      changed_when: eks_sg_rule.rc == 0
      failed_when: >
        eks_sg_rule.rc != 0 and
        'InvalidPermission.Duplicate' not in (eks_sg_rule.stderr | default(''))

    - name: Display EKS security group rule result
      ansible.builtin.debug:
        msg: "{{ eks_sg_rule.stdout | default('Rule already exists or was applied successfully') }}"

    - name: Get EKS endpoint IP addresses
      ansible.builtin.shell: |
        ENDPOINT=$(aws eks describe-cluster           --name "{{ eks_cluster_name }}"           --region "{{ aws_region }}"           --query 'cluster.endpoint'           --output text)

        HOST=$(echo "$ENDPOINT" | sed 's#https://##')
        getent hosts "$HOST" | awk '{print $1}' | sort -u
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: eks_endpoint_ips
      changed_when: false
      failed_when: false

    - name: Display EKS endpoint IP addresses
      ansible.builtin.debug:
        msg: "{{ eks_endpoint_ips.stdout_lines | default([]) }}"

    - name: Test EKS API port 443 connectivity
      ansible.builtin.shell: |
        ENDPOINT=$(aws eks describe-cluster           --name "{{ eks_cluster_name }}"           --region "{{ aws_region }}"           --query 'cluster.endpoint'           --output text)

        HOST=$(echo "$ENDPOINT" | sed 's#https://##')

        if command -v nc >/dev/null 2>&1; then
          while read -r IP; do
            [ -z "$IP" ] && continue
            nc -zvw 5 "$IP" 443
          done < <(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)
        else
          curl -vk --connect-timeout 10 "https://$HOST/healthz"
        fi
      register: eks_port_connectivity
      changed_when: false
      failed_when: false

    - name: Display EKS API connectivity result
      ansible.builtin.debug:
        msg:
          - "EKS API connectivity return code: {{ eks_port_connectivity.rc | default('N/A') }}"
          - "{{ eks_port_connectivity.stdout | default('') }}"
          - "{{ eks_port_connectivity.stderr | default('') }}"

    - name: Verify EKS connection
      ansible.builtin.command:
        cmd: kubectl --request-timeout=20s get nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: eks_nodes
      changed_when: false

    - name: Display EKS nodes
      ansible.builtin.debug:
        var: eks_nodes.stdout

    - name: Add Prometheus Community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Add Grafana Helm repository
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: https://grafana.github.io/helm-charts

    - name: Create monitoring namespace
      kubernetes.core.k8s:
        name: "{{ monitoring_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Install Prometheus Grafana Alertmanager stack
      kubernetes.core.helm:
        name: "{{ prometheus_release }}"
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: "{{ monitoring_namespace }}"
        create_namespace: true
        state: present
        wait: true
        timeout: 15m
        kubeconfig: "{{ kubeconfig_path }}"
        values:
          grafana:
            enabled: true
            adminUser: admin
            adminPassword: "admin123"
            service:
              type: NodePort
              nodePort: 30030

          prometheus:
            service:
              type: NodePort
              nodePort: 30090
            prometheusSpec:
              retention: 7d

          alertmanager:
            enabled: true
            service:
              type: NodePort
              nodePort: 30093

    - name: Check monitoring pods
      command: kubectl get pods -n "{{ monitoring_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: monitoring_pods
      changed_when: false

    - name: Check monitoring services
      command: kubectl get svc -n "{{ monitoring_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: monitoring_services
      changed_when: false

    - name: Install Java 21
      apt:
        name: openjdk-21-jre
        state: present
    - name: Add Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Update apt cache for Jenkins
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes


    # ==========================================
    # TRIVY
    # ==========================================

    - name: Download Trivy GPG key
      get_url:
        url: https://aquasecurity.github.io/trivy-repo/deb/public.key
        dest: /tmp/trivy-public.key
        mode: '0644'

    - name: Create Trivy keyring
      command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/trivy.gpg /tmp/trivy-public.key
      args:
        creates: /usr/share/keyrings/trivy.gpg

    - name: Add Trivy repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb {{ ansible_distribution_release }} main"
        state: present
        filename: trivy

    - name: Update apt cache for Trivy
      apt:
        update_cache: yes

    - name: Install Trivy
      apt:
        name: trivy
        state: present

    - name: Check Trivy version
      command: trivy --version
      register: trivy_version
      changed_when: false

    - name: Create SonarQube Docker network
      community.docker.docker_network:
        name: sonarqube-network
        state: present
    - name: Create SonarQube PostgreSQL volume
      community.docker.docker_volume:
        name: sonarqube-postgresql
        state: present

    - name: Create SonarQube PostgreSQL container
      community.docker.docker_container:
        name: "{{ sonarqube_db_container }}"
        image: postgres:15
        state: started
        restart_policy: unless-stopped

        env:
          POSTGRES_USER: "{{ sonarqube_db_user }}"
          POSTGRES_PASSWORD: "{{ sonarqube_db_password }}"
          POSTGRES_DB: "{{ sonarqube_db_name }}"

        volumes:
          - sonarqube-postgresql:/var/lib/postgresql/data

        networks:
          - name: sonarqube-network

    - name: Create SonarQube data volume
      community.docker.docker_volume:
        name: sonarqube-data
        state: present

    - name: Create SonarQube extensions volume
      community.docker.docker_volume:
        name: sonarqube-extensions
        state: present

    - name: Create SonarQube logs volume
      community.docker.docker_volume:
        name: sonarqube-logs
        state: present

    - name: Start SonarQube
      community.docker.docker_container:
        name: "{{ sonarqube_container }}"
        image: sonarqube:lts-community
        state: started
        restart_policy: unless-stopped

        published_ports:
          - "9000:9000"

        env:
          SONAR_JDBC_URL: "jdbc:postgresql://{{ sonarqube_db_container }}:5432/{{ sonarqube_db_name }}"
          SONAR_JDBC_USERNAME: "{{ sonarqube_db_user }}"
          SONAR_JDBC_PASSWORD: "{{ sonarqube_db_password }}"

        volumes:
          - sonarqube-data:/opt/sonarqube/data
          - sonarqube-extensions:/opt/sonarqube/extensions
          - sonarqube-logs:/opt/sonarqube/logs

        networks:
          - name: sonarqube-network

        memory: "2g"

    - name: Wait for SonarQube to start
      uri:
        url: http://localhost:9000/api/system/status
        method: GET
        status_code: 200

      register: sonarqube_status

      until:
        - sonarqube_status.status == 200

      retries: 30
      delay: 10

    - name: Remove old application directory
      file:
        path: "{{ app_directory }}"
        state: absent

    - name: Clone Flipkart project from GitHub
      git:
        repo: "{{ github_repo }}"
        dest: "{{ app_directory }}"
        version: main
    - name: Check Python version
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Create Python virtual environment
      command: python3 -m venv .venv
      args:
        chdir: "{{ app_directory }}"
        creates: "{{ app_directory }}/.venv/bin/activate"
    - name: Verify Python virtual environment
      command: "{{ app_directory }}/.venv/bin/python --version"
      register: venv_python_version
      changed_when: false

    - name: Check Git
      command: git --version
      register: git_version
      changed_when: false

    - name: Check Trivy
      command: trivy --version
      register: trivy_version
      changed_when: false

    - name: Check eksctl
      command: eksctl version
      register: eksctl_version
      changed_when: false

    - name: Check Helm
      command: helm version --short
      register: helm_version
      changed_when: false

    - name: Check AWS CLI
      command: aws --version
      register: aws_version
      changed_when: false

    - name: Check Nginx
      command: nginx -v
      register: nginx_version
      changed_when: false

    - name: Check Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Check kubectl
      command: kubectl version --client
      register: kubectl_result
      changed_when: false

    - name: Check Java
      command: java -version
      register: java_version
      changed_when: false

    - name: Check Jenkins
      command: systemctl is-active jenkins
      register: jenkins_status
      changed_when: false

    - name: Check SonarQube
      uri:
        url: http://localhost:9000/api/system/status
        method: GET
        status_code: 200
      register: sonarqube_final_status
      changed_when: false

    - name: Display monitoring status
      debug:
        msg:
          - "Monitoring namespace: {{ monitoring_namespace }}"
          - "Prometheus/Grafana/Alertmanager pods:"
          - "{{ monitoring_pods.stdout }}"

    - name: Display monitoring services
      debug:
        msg:
          - "Monitoring services:"
          - "{{ monitoring_services.stdout }}"

    - name: Display EKS network validation summary
      ansible.builtin.debug:
        msg:
          - "EKS cluster status: {{ eks_cluster_status.stdout }}"
          - "EKS endpoint: {{ eks_endpoint.stdout }}"
          - "EKS DNS resolution: {{ eks_endpoint_dns.stdout | default('FAILED') }}"
          - "EKS API connectivity return code: {{ eks_api_connectivity.rc | default('N/A') }}"
          - "EKS cluster security group: {{ eks_cluster_security_group }}"
          - "EC2 security group: {{ ec2_security_group }}"
          - "EKS port 443 test return code: {{ eks_port_connectivity.rc | default('N/A') }}"

    - name: Display installed tools
      debug:
        msg:

          - "=========================================="
          - "DEVOPS TOOLS INSTALLATION COMPLETE"
          - "=========================================="

          - "Git: {{ git_version.stdout }}"
          - "Python: {{ python_version.stdout }}"
          - "Python Virtual Environment: {{ venv_python_version.stdout }}"
          - "Trivy: {{ trivy_version.stdout }}"
          - "eksctl: {{ eksctl_version.stdout }}"
          - "Helm: {{ helm_version.stdout }}"
          - "AWS CLI: {{ aws_version.stdout }}"
          - "Nginx: {{ nginx_version.stderr }}"
          - "Docker: {{ docker_version.stdout }}"
          - "kubectl: {{ kubectl_result.stdout }}"
          - "Java: Installed successfully"
          - "Jenkins: {{ jenkins_status.stdout }}"
          - "SonarQube: {{ sonarqube_final_status.json.status | default('UP') }}"

          - "=========================================="
          - "CONFIGURATION"
          - "=========================================="

          - "EKS Cluster: {{ eks_cluster_name }}"
          - "AWS Region: {{ aws_region }}"
          - "Kubeconfig: {{ kubeconfig_path }}"
          - "Application Directory: {{ app_directory }}"
          - "SonarQube URL: http://YOUR_EC2_PUBLIC_IP:9000"
          - "Python virtual environment created successfully"
          - "Trivy installed successfully"
          - "eksctl installed successfully"
          - "Helm installed successfully"

          - "=========================================="
          - "ECR / DOCKER IMAGE OPERATIONS REMOVED"
          - "=========================================="
