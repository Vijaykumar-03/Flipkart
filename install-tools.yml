---
- name: Install DevOps Tools
  hosts: servers
  become: yes

  tasks:

    # -------------------------
    # Update system
    # -------------------------

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # -------------------------
    # Install basic packages
    # -------------------------

    - name: Install required packages
      apt:
        name:
          - git
          - curl
          - wget
          - unzip
          - ca-certificates
          - gnupg
          - apt-transport-https
          - software-properties-common
          - python3
          - python3-pip
        state: present

    # -------------------------
    # Install Nginx
    # -------------------------

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    # -------------------------
    # Install Docker
    # -------------------------

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo ${VERSION_CODENAME}) stable" \
        > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repository
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to Docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # -------------------------
    # Install Jenkins
    # -------------------------

    - name: Add Jenkins repository key
      shell: |
        curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key \
        -o /usr/share/keyrings/jenkins-keyring.asc
      args:
        creates: /usr/share/keyrings/jenkins-keyring.asc

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Update apt cache for Jenkins
      apt:
        update_cache: yes

    - name: Install Java for Jenkins
      apt:
        name: fontconfig
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes

    # -------------------------
    # Install kubectl
    # -------------------------

    - name: Download kubectl
      get_url:
        url: https://dl.k8s.io/release/stable.txt
        dest: /tmp/kubectl-version
        mode: '0644'

    - name: Get kubectl version
      shell: cat /tmp/kubectl-version
      register: kubectl_version
      changed_when: false

    - name: Download kubectl binary
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    # -------------------------
    # Verify installations
    # -------------------------

    - name: Check Git
      command: git --version
      register: git_version
      changed_when: false

    - name: Check Python
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Check Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Check kubectl
      command: kubectl version --client
      register: kubectl_result
      changed_when: false

    - name: Check Nginx
      command: nginx -v
      register: nginx_version
      changed_when: false

    - name: Display installed versions
      debug:
        msg:
          - "{{ git_version.stdout }}"
          - "{{ python_version.stdout }}"
          - "{{ docker_version.stdout }}"
          - "{{ kubectl_result.stdout }}"
          - "{{ nginx_version.stderr }}"
