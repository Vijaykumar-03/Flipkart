---
- name: Install DevOps Tools and Build Push Docker Image
  hosts: servers
  become: yes

  vars:
    aws_region: "ap-south-1"
    aws_account_id: "847547470089"

    ecr_repository: "devops-ecr"
    docker_image: "devops-ecr"
    docker_tag: "v1"

    ecr_registry: "847547470089.dkr.ecr.ap-south-1.amazonaws.com"
    ecr_image: "847547470089.dkr.ecr.ap-south-1.amazonaws.com/devops-ecr:v1"

    github_repo: "https://github.com/Vijaykumar-03/Flipkart.git"
    app_directory: "/opt/Flipkart"

    # SonarQube
    sonarqube_container: "sonarqube"
    sonarqube_db_container: "sonarqube-db"

    sonarqube_db_name: "sonarqube"
    sonarqube_db_user: "sonarqube"
    sonarqube_db_password: "sonarqube123"

  tasks:

    # ==========================================
    # UPDATE APT
    # ==========================================

    - name: Update apt cache
      apt:
        update_cache: yes

    # ==========================================
    # BASIC PACKAGES
    # ==========================================

    - name: Install required packages
      apt:
        name:
          - git
          - python3
          - python3-pip
          - awscli
          - curl
          - wget
          - ca-certificates
          - gnupg
          - fontconfig
        state: present

    # ==========================================
    # NGINX
    # ==========================================

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    # ==========================================
    # DOCKER
    # ==========================================

    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Update apt cache after Docker repository
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # ==========================================
    # KUBECTL
    # ==========================================

    - name: Download kubectl version
      get_url:
        url: https://dl.k8s.io/release/stable.txt
        dest: /tmp/kubectl-version
        mode: '0644'

    - name: Read kubectl version
      command: cat /tmp/kubectl-version
      register: kubectl_version
      changed_when: false

    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    # ==========================================
    # JAVA
    # ==========================================

    - name: Install Java 21
      apt:
        name: openjdk-21-jre
        state: present

    # ==========================================
    # JENKINS
    # ==========================================

    - name: Add Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Update apt cache for Jenkins
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes

    # ==========================================
    # SONARQUBE
    # ==========================================

    - name: Create SonarQube Docker network
      community.docker.docker_network:
        name: sonarqube-network
        state: present

    # ==========================================
    # SONARQUBE POSTGRESQL
    # ==========================================

    - name: Create SonarQube PostgreSQL volume
      community.docker.docker_volume:
        name: sonarqube-postgresql
        state: present

    - name: Create SonarQube PostgreSQL container
      community.docker.docker_container:
        name: "{{ sonarqube_db_container }}"
        image: postgres:15
        state: started
        restart_policy: unless-stopped
        env:
          POSTGRES_USER: "{{ sonarqube_db_user }}"
          POSTGRES_PASSWORD: "{{ sonarqube_db_password }}"
          POSTGRES_DB: "{{ sonarqube_db_name }}"
        volumes:
          - sonarqube-postgresql:/var/lib/postgresql/data
        networks:
          - name: sonarqube-network

    # ==========================================
    # SONARQUBE VOLUMES
    # ==========================================

    - name: Create SonarQube data volume
      community.docker.docker_volume:
        name: sonarqube-data
        state: present

    - name: Create SonarQube extensions volume
      community.docker.docker_volume:
        name: sonarqube-extensions
        state: present

    - name: Create SonarQube logs volume
      community.docker.docker_volume:
        name: sonarqube-logs
        state: present

    # ==========================================
    # SONARQUBE CONTAINER
    # ==========================================

    - name: Start SonarQube
      community.docker.docker_container:
        name: "{{ sonarqube_container }}"
        image: sonarqube:lts-community
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "9000:9000"
        env:
          SONAR_JDBC_URL: "jdbc:postgresql://{{ sonarqube_db_container }}:5432/{{ sonarqube_db_name }}"
          SONAR_JDBC_USERNAME: "{{ sonarqube_db_user }}"
          SONAR_JDBC_PASSWORD: "{{ sonarqube_db_password }}"
        volumes:
          - sonarqube-data:/opt/sonarqube/data
          - sonarqube-extensions:/opt/sonarqube/extensions
          - sonarqube-logs:/opt/sonarqube/logs
        networks:
          - name: sonarqube-network
        memory: "2g"

    # ==========================================
    # WAIT FOR SONARQUBE
    # ==========================================

    - name: Wait for SonarQube to start
      uri:
        url: http://localhost:9000/api/system/status
        method: GET
        status_code: 200
      register: sonarqube_status
      until: sonarqube_status.status == 200
      retries: 30
      delay: 10

    # ==========================================
    # VERIFY AWS
    # ==========================================

    - name: Check AWS identity
      command: aws sts get-caller-identity
      register: aws_identity
      changed_when: false

    - name: Display AWS identity
      debug:
        var: aws_identity.stdout

    # ==========================================
    # CLONE GITHUB PROJECT
    # ==========================================

    - name: Remove old application directory
      file:
        path: "{{ app_directory }}"
        state: absent

    - name: Clone Flipkart project from GitHub
      git:
        repo: "{{ github_repo }}"
        dest: "{{ app_directory }}"
        version: main

    # ==========================================
    # LOGIN TO ECR
    # ==========================================

    - name: Login to Amazon ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | \
        docker login \
        --username AWS \
        --password-stdin {{ ecr_registry }}
      changed_when: false

    # ==========================================
    # BUILD DOCKER IMAGE
    # ==========================================

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        tag: "{{ docker_tag }}"
        source: build
        build:
          path: "{{ app_directory }}"

    # ==========================================
    # TAG DOCKER IMAGE
    # ==========================================

    - name: Tag Docker image for ECR
      community.docker.docker_image:
        name: "{{ docker_image }}"
        tag: "{{ docker_tag }}"
        repository: "{{ ecr_registry }}/{{ ecr_repository }}"
        source: local
        force_tag: true

    # ==========================================
    # PUSH IMAGE TO ECR
    # ==========================================

    - name: Push Docker image to ECR
      community.docker.docker_image:
        name: "{{ ecr_registry }}/{{ ecr_repository }}"
        tag: "{{ docker_tag }}"
        push: true
        source: local

    # ==========================================
    # VERIFICATION
    # ==========================================

    - name: Check Git
      command: git --version
      register: git_version
      changed_when: false

    - name: Check Python
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Check AWS CLI
      command: aws --version
      register: aws_version
      changed_when: false

    - name: Check Nginx
      command: nginx -v
      register: nginx_version
      changed_when: false

    - name: Check Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Check kubectl
      command: kubectl version --client
      register: kubectl_result
      changed_when: false

    - name: Check Java
      command: java -version
      register: java_version
      changed_when: false

    - name: Check Jenkins
      command: systemctl is-active jenkins
      register: jenkins_status
      changed_when: false

    - name: Check SonarQube
      uri:
        url: http://localhost:9000/api/system/status
        method: GET
        status_code: 200
      register: sonarqube_final_status
      changed_when: false

    - name: Display installed tools
      debug:
        msg:
          - "{{ git_version.stdout }}"
          - "{{ python_version.stdout }}"
          - "{{ aws_version.stdout }}"
          - "{{ nginx_version.stderr }}"
          - "{{ docker_version.stdout }}"
          - "{{ kubectl_result.stdout }}"
          - "Java installed successfully"
          - "Jenkins: {{ jenkins_status.stdout }}"
          - "SonarQube: {{ sonarqube_final_status.json.status | default('UP') }}"
          - "SonarQube URL: http://YOUR_EC2_PUBLIC_IP:9000"
          - "Docker image built: {{ docker_image }}:{{ docker_tag }}"
          - "ECR image pushed: {{ ecr_image }}"
