---
- name: Install DevOps Tools
  hosts: servers
  become: yes

  vars_files:
    - secrets.yml

  vars:

    # ==========================================
    # AWS CONFIGURATION
    # ==========================================

    aws_region: "ap-south-1"
    aws_account_id: "847547470089"

    eks_cluster_name: "devops-eks"
    kubeconfig_path: "/root/.kube/config"

    # AWS credentials from Ansible Vault
    aws_access_key_id: "{{ vault_aws_access_key_id }}"
    aws_secret_access_key: "{{ vault_aws_secret_access_key }}"


    # ==========================================
    # GITHUB CONFIGURATION
    # ==========================================

    github_repo: "https://github.com/Vijaykumar-03/Flipkart.git"
    app_directory: "/opt/Flipkart"


    # ==========================================
    # SONARQUBE CONFIGURATION
    # ==========================================

    sonarqube_container: "sonarqube"
    sonarqube_db_container: "sonarqube-db"

    sonarqube_db_name: "sonarqube"
    sonarqube_db_user: "sonarqube"
    sonarqube_db_password: "sonarqube123"


    # ==========================================
    # KUBERNETES MONITORING / LOGGING
    # ==========================================

    monitoring_namespace: "monitoring"
    logging_namespace: "logging"

    prometheus_release: "kube-prometheus-stack"
    grafana_release: "kube-prometheus-stack"

    elasticsearch_release: "elasticsearch"
    fluent_bit_release: "fluent-bit"
    kibana_release: "kibana"

    # Existing StorageClass
    elasticsearch_storage_class: "gp2"
    elasticsearch_storage_size: "10Gi"


  tasks:

    # ==========================================
    # UPDATE APT
    # ==========================================

    - name: Update apt cache
      apt:
        update_cache: yes


    # ==========================================
    # BASIC PACKAGES
    # ==========================================

    - name: Install required packages
      apt:
        name:
          - git
          - python3
          - python3-pip
          - python3-venv
          - awscli
          - curl
          - wget
          - unzip
          - ca-certificates
          - gnupg
          - fontconfig
        state: present


    # ==========================================
    # NGINX
    # ==========================================

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes


    # ==========================================
    # DOCKER
    # ==========================================

    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Update apt cache after Docker repository
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes


    # ==========================================
    # KUBECTL
    # ==========================================

    - name: Download kubectl version
      get_url:
        url: https://dl.k8s.io/release/stable.txt
        dest: /tmp/kubectl-version
        mode: '0644'

    - name: Read kubectl version
      command: cat /tmp/kubectl-version
      register: kubectl_version
      changed_when: false

    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'


    # ==========================================
    # EKSCTL
    # ==========================================

    - name: Install eksctl
      shell: |
        set -e

        ARCH=$(uname -m)

        if [ "$ARCH" = "x86_64" ]; then
          EKSCTL_ARCH="amd64"
        elif [ "$ARCH" = "aarch64" ]; then
          EKSCTL_ARCH="arm64"
        else
          echo "Unsupported architecture: $ARCH"
          exit 1
        fi

        curl --fail --silent --show-error --location \
          "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_${EKSCTL_ARCH}.tar.gz" \
          -o /tmp/eksctl.tar.gz

        tar -xzf /tmp/eksctl.tar.gz -C /tmp

        install -m 0755 /tmp/eksctl /usr/local/bin/eksctl

        rm -f /tmp/eksctl.tar.gz
        rm -f /tmp/eksctl

      args:
        creates: /usr/local/bin/eksctl


    - name: Check eksctl version
      command: eksctl version
      register: eksctl_version
      changed_when: false


    # ==========================================
    # HELM
    # ==========================================

    - name: Install Helm
      shell: |
        set -e
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      args:
        creates: /usr/local/bin/helm


    - name: Check Helm version
      command: helm version --short
      register: helm_version
      changed_when: false


    # ==========================================
    # KUBERNETES COLLECTIONS / PYTHON CLIENT
    # ==========================================

    - name: Install Ansible Kubernetes collection
      command: ansible-galaxy collection install kubernetes.core
      changed_when: false

    - name: Install Python Kubernetes client
      apt:
        name:
          - python3-kubernetes
        state: present


    # ==========================================
    # AWS CLI CONFIGURATION
    # ==========================================

    - name: Configure AWS CLI
      shell: |
        aws configure set aws_access_key_id "{{ aws_access_key_id }}"
        aws configure set aws_secret_access_key "{{ aws_secret_access_key }}"
        aws configure set region "{{ aws_region }}"
        aws configure set output json

      no_log: true


    # ==========================================
    # VERIFY AWS
    # ==========================================

    - name: Check AWS identity
      command: aws sts get-caller-identity
      register: aws_identity
      changed_when: false

    - name: Display AWS identity
      debug:
        var: aws_identity.stdout


    # ==========================================
    # EKS KUBECONFIG
    # ==========================================

    - name: Create .kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: Configure kubeconfig for EKS
      ansible.builtin.command:
        cmd: >
          aws eks update-kubeconfig
          --region {{ aws_region }}
          --name {{ eks_cluster_name }}
          --kubeconfig {{ kubeconfig_path }}
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      no_log: true

    - name: Verify EKS connection
      ansible.builtin.command:
        cmd: kubectl get nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: eks_nodes
      changed_when: false

    - name: Display EKS nodes
      ansible.builtin.debug:
        var: eks_nodes.stdout


    # ==========================================
    # HELM REPOSITORIES
    # ==========================================

    - name: Add Prometheus Community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Add Grafana Helm repository
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: https://grafana.github.io/helm-charts

    - name: Add Elastic Helm repository
      kubernetes.core.helm_repository:
        name: elastic
        repo_url: https://helm.elastic.co

    - name: Add Fluent Helm repository
      kubernetes.core.helm_repository:
        name: fluent
        repo_url: https://fluent.github.io/helm-charts


    # ==========================================
    # KUBERNETES NAMESPACES
    # ==========================================

    - name: Create monitoring namespace
      kubernetes.core.k8s:
        name: "{{ monitoring_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Create logging namespace
      kubernetes.core.k8s:
        name: "{{ logging_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig_path }}"


    # ==========================================
    # PROMETHEUS + GRAFANA + ALERTMANAGER
    # ==========================================

    - name: Install Prometheus Grafana Alertmanager stack
      kubernetes.core.helm:
        name: "{{ prometheus_release }}"
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: "{{ monitoring_namespace }}"
        create_namespace: true
        state: present
        wait: true
        timeout: 15m
        kubeconfig: "{{ kubeconfig_path }}"

        values:

          grafana:
            enabled: true

            adminUser: admin
            adminPassword: "admin123"

            service:
              type: NodePort
              nodePort: 30030

          prometheus:

            service:
              type: NodePort
              nodePort: 30090

            prometheusSpec:
              retention: 7d

          alertmanager:

            enabled: true

            service:
              type: NodePort
              nodePort: 30093


    # ==========================================
    # ELASTICSEARCH
    # ==========================================

    - name: Install Elasticsearch
      kubernetes.core.helm:
        name: "{{ elasticsearch_release }}"
        chart_ref: elastic/elasticsearch
        release_namespace: "{{ logging_namespace }}"
        create_namespace: true
        state: present
        wait: true
        timeout: 15m
        kubeconfig: "{{ kubeconfig_path }}"

        values:

          replicas: 1

          minimumMasterNodes: 1

          resources:

            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "1"
              memory: "2Gi"

          volumeClaimTemplate:

            accessModes:
              - ReadWriteOnce

            storageClassName: "{{ elasticsearch_storage_class }}"

            resources:

              requests:
                storage: "{{ elasticsearch_storage_size }}"


    # ==========================================
    # FLUENT BIT
    # ==========================================

    - name: Install Fluent Bit
      kubernetes.core.helm:
        name: "{{ fluent_bit_release }}"
        chart_ref: fluent/fluent-bit
        release_namespace: "{{ logging_namespace }}"
        create_namespace: true
        state: present
        wait: true
        timeout: 10m
        kubeconfig: "{{ kubeconfig_path }}"

        values:

          serviceAccount:
            create: true

          daemonSetVolumes:

            - name: varlog
              hostPath:
                path: /var/log

            - name: varlibdockercontainers
              hostPath:
                path: /var/lib/docker/containers

          daemonSetVolumeMounts:

            - name: varlog
              mountPath: /var/log

            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true


    # ==========================================
    # KIBANA
    # ==========================================

    - name: Install Kibana
      kubernetes.core.helm:
        name: "{{ kibana_release }}"
        chart_ref: elastic/kibana
        release_namespace: "{{ logging_namespace }}"
        create_namespace: true
        state: present
        wait: true
        timeout: 15m
        kubeconfig: "{{ kubeconfig_path }}"

        values:

          replicas: 1

          service:
            type: NodePort
            nodePort: 30561

          resources:

            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"


    # ==========================================
    # VERIFY MONITORING / LOGGING
    # ==========================================

    - name: Check monitoring pods
      command: kubectl get pods -n "{{ monitoring_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: monitoring_pods
      changed_when: false

    - name: Check logging pods
      command: kubectl get pods -n "{{ logging_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: logging_pods
      changed_when: false

    - name: Check monitoring services
      command: kubectl get svc -n "{{ monitoring_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: monitoring_services
      changed_when: false

    - name: Check logging services
      command: kubectl get svc -n "{{ logging_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: logging_services
      changed_when: false


    # ==========================================
    # JAVA
    # ==========================================

    - name: Install Java 21
      apt:
        name: openjdk-21-jre
        state: present


    # ==========================================
    # JENKINS
    # ==========================================

    - name: Add Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Update apt cache for Jenkins
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes


    # ==========================================
    # TRIVY
    # ==========================================

    - name: Download Trivy GPG key
      get_url:
        url: https://aquasecurity.github.io/trivy-repo/deb/public.key
        dest: /tmp/trivy-public.key
        mode: '0644'

    - name: Create Trivy keyring
      command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/trivy.gpg /tmp/trivy-public.key
      args:
        creates: /usr/share/keyrings/trivy.gpg

    - name: Add Trivy repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb {{ ansible_distribution_release }} main"
        state: present
        filename: trivy

    - name: Update apt cache for Trivy
      apt:
        update_cache: yes

    - name: Install Trivy
      apt:
        name: trivy
        state: present

    - name: Check Trivy version
      command: trivy --version
      register: trivy_version
      changed_when: false


    # ==========================================
    # SONARQUBE NETWORK
    # ==========================================

    - name: Create SonarQube Docker network
      community.docker.docker_network:
        name: sonarqube-network
        state: present


    # ==========================================
    # SONARQUBE POSTGRESQL
    # ==========================================

    - name: Create SonarQube PostgreSQL volume
      community.docker.docker_volume:
        name: sonarqube-postgresql
        state: present

    - name: Create SonarQube PostgreSQL container
      community.docker.docker_container:
        name: "{{ sonarqube_db_container }}"
        image: postgres:15
        state: started
        restart_policy: unless-stopped

        env:
          POSTGRES_USER: "{{ sonarqube_db_user }}"
          POSTGRES_PASSWORD: "{{ sonarqube_db_password }}"
          POSTGRES_DB: "{{ sonarqube_db_name }}"

        volumes:
          - sonarqube-postgresql:/var/lib/postgresql/data

        networks:
          - name: sonarqube-network


    # ==========================================
    # SONARQUBE VOLUMES
    # ==========================================

    - name: Create SonarQube data volume
      community.docker.docker_volume:
        name: sonarqube-data
        state: present

    - name: Create SonarQube extensions volume
      community.docker.docker_volume:
        name: sonarqube-extensions
        state: present

    - name: Create SonarQube logs volume
      community.docker.docker_volume:
        name: sonarqube-logs
        state: present


    # ==========================================
    # SONARQUBE CONTAINER
    # ==========================================

    - name: Start SonarQube
      community.docker.docker_container:
        name: "{{ sonarqube_container }}"
        image: sonarqube:lts-community
        state: started
        restart_policy: unless-stopped

        published_ports:
          - "9000:9000"

        env:
          SONAR_JDBC_URL: "jdbc:postgresql://{{ sonarqube_db_container }}:5432/{{ sonarqube_db_name }}"
          SONAR_JDBC_USERNAME: "{{ sonarqube_db_user }}"
          SONAR_JDBC_PASSWORD: "{{ sonarqube_db_password }}"

        volumes:
          - sonarqube-data:/opt/sonarqube/data
          - sonarqube-extensions:/opt/sonarqube/extensions
          - sonarqube-logs:/opt/sonarqube/logs

        networks:
          - name: sonarqube-network

        memory: "2g"


    # ==========================================
    # WAIT FOR SONARQUBE
    # ==========================================

    - name: Wait for SonarQube to start
      uri:
        url: http://localhost:9000/api/system/status
        method: GET
        status_code: 200

      register: sonarqube_status

      until:
        - sonarqube_status.status == 200

      retries: 30
      delay: 10


    # ==========================================
    # CLONE GITHUB PROJECT
    # ==========================================

    - name: Remove old application directory
      file:
        path: "{{ app_directory }}"
        state: absent

    - name: Clone Flipkart project from GitHub
      git:
        repo: "{{ github_repo }}"
        dest: "{{ app_directory }}"
        version: main


    # ==========================================
    # PYTHON VERSION
    # ==========================================

    - name: Check Python version
      command: python3 --version
      register: python_version
      changed_when: false


    # ==========================================
    # PYTHON VIRTUAL ENVIRONMENT
    # ==========================================

    - name: Create Python virtual environment
      command: python3 -m venv .venv
      args:
        chdir: "{{ app_directory }}"
        creates: "{{ app_directory }}/.venv/bin/activate"


    # ==========================================
    # VERIFY PYTHON VIRTUAL ENVIRONMENT
    # ==========================================

    - name: Verify Python virtual environment
      command: "{{ app_directory }}/.venv/bin/python --version"
      register: venv_python_version
      changed_when: false


    # ==========================================
    # VERIFICATION
    # ==========================================

    - name: Check Git
      command: git --version
      register: git_version
      changed_when: false

    - name: Check Python
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Check Python Virtual Environment
      command: "{{ app_directory }}/.venv/bin/python --version"
      register: venv_python_version
      changed_when: false

    - name: Check Trivy
      command: trivy --version
      register: trivy_version
      changed_when: false

    - name: Check eksctl
      command: eksctl version
      register: eksctl_version
      changed_when: false

    - name: Check Helm
      command: helm version --short
      register: helm_version
      changed_when: false

    - name: Check AWS CLI
      command: aws --version
      register: aws_version
      changed_when: false

    - name: Check Nginx
      command: nginx -v
      register: nginx_version
      changed_when: false

    - name: Check Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Check kubectl
      command: kubectl version --client
      register: kubectl_result
      changed_when: false

    - name: Check Java
      command: java -version
      register: java_version
      changed_when: false

    - name: Check Jenkins
      command: systemctl is-active jenkins
      register: jenkins_status
      changed_when: false

    - name: Check SonarQube
      uri:
        url: http://localhost:9000/api/system/status
        method: GET
        status_code: 200

      register: sonarqube_final_status
      changed_when: false


    # ==========================================
    # MONITORING / LOGGING STATUS
    # ==========================================

    - name: Display monitoring status
      debug:
        msg:
          - "Monitoring namespace: {{ monitoring_namespace }}"
          - "Prometheus/Grafana/Alertmanager pods:"
          - "{{ monitoring_pods.stdout }}"

    - name: Display logging status
      debug:
        msg:
          - "Logging namespace: {{ logging_namespace }}"
          - "Elasticsearch/Fluent Bit/Kibana pods:"
          - "{{ logging_pods.stdout }}"

    - name: Display monitoring services
      debug:
        msg:
          - "Monitoring services:"
          - "{{ monitoring_services.stdout }}"

    - name: Display logging services
      debug:
        msg:
          - "Logging services:"
          - "{{ logging_services.stdout }}"


    # ==========================================
    # DISPLAY INSTALLED TOOLS
    # ==========================================

    - name: Display installed tools
      debug:
        msg:

          - "=========================================="
          - "DEVOPS TOOLS INSTALLATION COMPLETE"
          - "=========================================="

          - "Git: {{ git_version.stdout }}"
          - "Python: {{ python_version.stdout }}"
          - "Python Virtual Environment: {{ venv_python_version.stdout }}"
          - "Trivy: {{ trivy_version.stdout }}"
          - "eksctl: {{ eksctl_version.stdout }}"
          - "Helm: {{ helm_version.stdout }}"
          - "AWS CLI: {{ aws_version.stdout }}"
          - "Nginx: {{ nginx_version.stderr }}"
          - "Docker: {{ docker_version.stdout }}"
          - "kubectl: {{ kubectl_result.stdout }}"
          - "Java: Installed successfully"
          - "Jenkins: {{ jenkins_status.stdout }}"
          - "SonarQube: {{ sonarqube_final_status.json.status | default('UP') }}"

          - "=========================================="
          - "CONFIGURATION"
          - "=========================================="

          - "EKS Cluster: {{ eks_cluster_name }}"
          - "AWS Region: {{ aws_region }}"
          - "Kubeconfig: {{ kubeconfig_path }}"
          - "Application Directory: {{ app_directory }}"
          - "Elasticsearch StorageClass: {{ elasticsearch_storage_class }}"
          - "Elasticsearch Storage: {{ elasticsearch_storage_size }}"
          - "SonarQube URL: http://YOUR_EC2_PUBLIC_IP:9000"
          - "Python virtual environment created successfully"
          - "Trivy installed successfully"
          - "eksctl installed successfully"
          - "Helm installed successfully"

          - "=========================================="
          - "ECR / DOCKER IMAGE OPERATIONS REMOVED"
          - "=========================================="
