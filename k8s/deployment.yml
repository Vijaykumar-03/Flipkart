apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-app
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flipkart-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: flipkart-app

    spec:
      containers:
        - name: flipkart-app

          image: 847547470089.dkr.ecr.ap-south-2.amazonaws.com/devops-ecr:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
